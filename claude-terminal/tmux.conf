# tmux keeps the web terminal session alive across browser refreshes and
# ingress reconnects (see scripts/attach-session.sh). It should otherwise be
# invisible: no status bar, no key bindings, and the browser's xterm.js keeps
# scrolling, selection and links.

set -g default-terminal "tmux-256color"

# No prefix key and no bindings, so every key (including Ctrl+B, which Claude
# uses to background a running command) goes straight to the application.
set -g prefix None
set -g prefix2 None
unbind-key -a

# Mouse mode would capture the mouse in tmux and break selecting and copying
# text in the browser.
set -g mouse off
set -g status off

# Draw in the browser terminal's normal screen instead of the alternate screen,
# so output scrolls into xterm.js scrollback and wheel/touch scrolling and
# selection work as they do without tmux. With the terminal's indn capability,
# tmux scrolls with CSI n S, which xterm.js discards from scrollback. Overriding
# indn@ makes tmux scroll with linefeeds so lines land in scrollback.
set -as terminal-overrides ",xterm*:smcup@:rmcup@:indn@"

# Pass through what xterm.js supports: 24-bit colour, OSC 8 hyperlinks (Claude
# marks every wrapped row of its login URL with the full link), clipboard,
# focus events, extended keys and synchronized output.
set -as terminal-features ",xterm*:RGB:hyperlinks:clipboard:focus:extkeys:sync"
set -s set-clipboard on
set -s extended-keys on
set -g focus-events on
set -g allow-passthrough on

# Forward the application's window title to the browser tab.
set -g set-titles on
set -g set-titles-string "#T"

# Only wait briefly to tell a lone Esc from the start of an escape sequence.
set -s escape-time 10

# Replayed into the browser's scrollback on reattach.
set -g history-limit 10000
