name: Update Codex CLI

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      codex_release:
        description: Codex release to pin, for example 0.166.0. Leave blank for npm's latest.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-codex-terminal
  cancel-in-progress: false

env:
  BRANCH: automation/update-codex-cli
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

# GITHUB_TOKEN pushes and pull requests don't trigger other workflows, but
# workflow_dispatch does. This job dispatches Build on the PR branch, which
# reports the required CI check on its head commit, merges once it passes, then
# dispatches Build on main to publish the release.
jobs:
  update:
    name: Update, validate and merge
    runs-on: ubuntu-26.04
    # Build validation alone allows up to 10 minutes per job.
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update pinned Codex release
        id: update
        env:
          CODEX_RELEASE_OVERRIDE: ${{ inputs.codex_release }}
        run: .github/scripts/update-codex-terminal.sh

      - name: Push branch and open pull request
        id: pr
        if: steps.update.outputs.changed == 'true'
        env:
          CODEX_RELEASE: ${{ steps.update.outputs.codex_release }}
          PREVIOUS_CODEX_RELEASE: ${{ steps.update.outputs.previous_codex_release }}
          ADDON_VERSION: ${{ steps.update.outputs.addon_version }}
          PREVIOUS_ADDON_VERSION: ${{ steps.update.outputs.previous_addon_version }}
        run: |
          title="codex-terminal: update Codex CLI to ${CODEX_RELEASE} (${ADDON_VERSION})"
          number="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"

          # A pull request already pinning this release has been validated; if
          # it is still open, its checks failed. Don't retry it every day.
          if [[ -n "${number}" ]] \
              && git fetch --depth=1 origin "${BRANCH}" \
              && git show FETCH_HEAD:codex-terminal/Dockerfile | grep -qx "ARG CODEX_RELEASE=${CODEX_RELEASE}"; then
            echo "::warning::#${number} already pins Codex ${CODEX_RELEASE} and is unmerged; check its CI."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git commit -am "${title}"
          git push --force origin "${BRANCH}"

          body="$(printf '%s\n' \
            "Updates the Codex CLI that codex-terminal installs and releases the add-on." \
            "" \
            "- Codex: \`${PREVIOUS_CODEX_RELEASE}\` → \`${CODEX_RELEASE}\`" \
            "- Add-on: \`${PREVIOUS_ADDON_VERSION}\` → \`${ADDON_VERSION}\`" \
            "" \
            "Opened by the [Update Codex CLI](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow, which merges it once CI passes.")"
          if [[ -n "${number}" ]]; then
            gh pr edit "${number}" --title "${title}" --body "${body}"
          else
            gh pr create --base main --head "${BRANCH}" --title "${title}" --body "${body}"
            number="$(gh pr view "${BRANCH}" --json number --jq .number)"
          fi
          {
            echo "number=${number}"
            echo "title=${title}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Run CI on the pull request
        if: steps.update.outputs.changed == 'true' && steps.pr.outputs.skip != 'true'
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh workflow run build.yml --ref "${BRANCH}"
          for _ in $(seq 30); do
            run_id="$(gh run list --workflow build.yml --event workflow_dispatch --commit "${SHA}" \
              --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "${run_id}" ]] && break
            sleep 10
          done
          if [[ -z "${run_id}" ]]; then
            echo "::error::The dispatched Build run for ${SHA} did not appear."
            exit 1
          fi
          echo "Waiting for ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh run watch "${run_id}" --exit-status --interval 30 > /dev/null

      - name: Merge and publish
        if: steps.update.outputs.changed == 'true' && steps.pr.outputs.skip != 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          TITLE: ${{ steps.pr.outputs.title }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh pr merge "${NUMBER}" --squash --match-head-commit "${SHA}" \
            --subject "${TITLE} (#${NUMBER})" --body ""
          # The merge push came from GITHUB_TOKEN, so Build won't start on its own.
          gh workflow run build.yml --ref main
