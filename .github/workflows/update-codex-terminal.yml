name: Update Codex CLI

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      codex_release:
        description: Codex release to pin, for example 0.166.0. Leave blank for npm's latest.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-codex-terminal
  cancel-in-progress: false

env:
  BRANCH: automation/update-codex-cli
  GH_REPO: ${{ github.repository }}

# Uses a GitHub App token because GITHUB_TOKEN's pull requests don't get a usable
# CI check, and its merges don't start Build on main. With the App, Build runs on
# the pull request, GitHub merges it once the required CI check passes, and that
# merge publishes the release.
jobs:
  update:
    name: Update and enable auto-merge
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Create App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CODEX_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEX_UPDATE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Update pinned Codex release
        id: update
        env:
          CODEX_RELEASE_OVERRIDE: ${{ inputs.codex_release }}
        run: .github/scripts/update-codex-terminal.sh

      - name: Open pull request and enable auto-merge
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CODEX_RELEASE: ${{ steps.update.outputs.codex_release }}
          PREVIOUS_CODEX_RELEASE: ${{ steps.update.outputs.previous_codex_release }}
          ADDON_VERSION: ${{ steps.update.outputs.addon_version }}
          PREVIOUS_ADDON_VERSION: ${{ steps.update.outputs.previous_addon_version }}
        run: |
          title="codex-terminal: update Codex CLI to ${CODEX_RELEASE} (${ADDON_VERSION})"
          number="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"

          # This release's pull request is already open, so a failed check is
          # holding it. Retry once a day: auto-merge finishes it if the retry
          # passes. A real failure just fails again.
          if [[ -n "${number}" ]] \
              && git fetch --depth=1 origin "${BRANCH}" \
              && git show FETCH_HEAD:codex-terminal/Dockerfile | grep -qx "ARG CODEX_RELEASE=${CODEX_RELEASE}"; then
            sha="$(git rev-parse FETCH_HEAD)"
            gh pr merge "${number}" --auto --squash --match-head-commit "${sha}" \
              --subject "${title} (#${number})" --body ""
            run_id="$(gh run list --workflow build.yml --event pull_request --commit "${sha}" --status failure \
              --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "${run_id}" ]]; then
              echo "Retrying failed jobs in Build run ${run_id} for #${number}"
              gh run rerun "${run_id}" --failed
            else
              echo "#${number} has no failed Build run to retry."
            fi
            exit 0
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git commit -am "${title}"
          git push --force origin "${BRANCH}"

          body="$(printf '%s\n' \
            "Updates the Codex CLI that codex-terminal installs and releases the add-on." \
            "" \
            "- Codex: \`${PREVIOUS_CODEX_RELEASE}\` → \`${CODEX_RELEASE}\`" \
            "- Add-on: \`${PREVIOUS_ADDON_VERSION}\` → \`${ADDON_VERSION}\`" \
            "" \
            "Opened by the [Update Codex CLI](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow. GitHub merges it once CI passes, which publishes the release.")"
          if [[ -n "${number}" ]]; then
            gh pr edit "${number}" --title "${title}" --body "${body}"
          else
            gh pr create --base main --head "${BRANCH}" --title "${title}" --body "${body}"
            number="$(gh pr view "${BRANCH}" --json number --jq .number)"
          fi
          gh pr merge "${number}" --auto --squash --match-head-commit "$(git rev-parse HEAD)" \
            --subject "${title} (#${number})" --body ""
