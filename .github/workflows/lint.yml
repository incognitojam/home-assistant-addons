name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - ".github/workflows/lint.yml"

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - claude-terminal/Dockerfile
          - codex-terminal/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hadolint
        run: |
          docker run --rm \
            --volume "${PWD}:/repo:ro" \
            --workdir /repo \
            ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint "${{ matrix.dockerfile }}"
