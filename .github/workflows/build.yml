name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Supervisor pulls ghcr.io/incognitojam/{arch}-<add-on>:<version>.
  IMAGE_OWNER: incognitojam

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check published images
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      validate_claude: ${{ steps.changes.outputs.validate_claude }}
      validate_codex: ${{ steps.changes.outputs.validate_codex }}
      claude_targets: ${{ steps.check.outputs.claude_targets || '[]' }}
      codex_targets: ${{ steps.check.outputs.codex_targets || '[]' }}
      keys: ${{ steps.check.outputs.keys || '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A pull request that only touches one add-on doesn't validate the other.
      # Everything else validates both, including every run on main.
      - name: Find add-ons to validate
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          validate_claude=true
          validate_codex=true
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
            echo "${files}"
            if ! grep -v '^codex-terminal/' <<< "${files}" > /dev/null; then
              validate_claude=false
            fi
            if ! grep -v '^claude-terminal/' <<< "${files}" > /dev/null; then
              validate_codex=false
            fi
          fi
          {
            echo "validate_claude=${validate_claude}"
            echo "validate_codex=${validate_codex}"
          } >> "${GITHUB_OUTPUT}"

      # Each version is published once: an existing tag is a release and is
      # never overwritten, so a push without a version bump publishes nothing.
      - name: Find versions without an image
        id: check
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          targets='[]'
          for addon in claude-terminal codex-terminal; do
            version="$(awk -F': *' '/^version:/ { gsub(/"/, "", $2); print $2; exit }' "${addon}/config.yaml")"
            for arch in amd64 aarch64; do
              repository="${IMAGE_OWNER}/${arch}-${addon}"
              state="$(.github/scripts/ghcr-tag-state.sh "${repository}" "${version}")"
              echo "ghcr.io/${repository}:${version} is ${state}"
              if [[ "${state}" == missing ]]; then
                targets="$(jq -c --arg addon "${addon}" --arg arch "${arch}" --arg version "${version}" \
                  '. + [{addon: $addon, arch: $arch, version: $version}]' <<< "${targets}")"
              fi
            done
          done
          {
            echo "claude_targets=$(jq -c '[.[] | select(.addon == "claude-terminal")]' <<< "${targets}")"
            echo "codex_targets=$(jq -c '[.[] | select(.addon == "codex-terminal")]' <<< "${targets}")"
            echo "keys=$(jq -c 'map("\(.addon)/\(.arch)")' <<< "${targets}")"
          } >> "${GITHUB_OUTPUT}"

  claude:
    name: Validate claude-terminal
    needs: check
    if: needs.check.outputs.validate_claude == 'true'
    uses: ./.github/workflows/validate-addon.yml
    with:
      addon: claude-terminal
      keys: ${{ needs.check.outputs.keys || '[]' }}

  codex:
    name: Validate codex-terminal
    needs: check
    if: needs.check.outputs.validate_codex == 'true'
    uses: ./.github/workflows/validate-addon.yml
    with:
      addon: codex-terminal
      keys: ${{ needs.check.outputs.keys || '[]' }}

  publish_claude:
    name: Publish claude-terminal
    needs: [check, claude]
    # A sibling failure is independent; a canceled run or incomplete own checks
    # must never publish. Check the list before calling a dynamic matrix.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' && needs.claude.result == 'success' &&
      needs.check.outputs.claude_targets != '' && needs.check.outputs.claude_targets != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-addon.yml
    with:
      targets: ${{ needs.check.outputs.claude_targets || '[]' }}

  publish_codex:
    name: Publish codex-terminal
    needs: [check, codex]
    # A sibling failure is independent; a canceled run or incomplete own checks
    # must never publish. Check the list before calling a dynamic matrix.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' && needs.codex.result == 'success' &&
      needs.check.outputs.codex_targets != '' && needs.check.outputs.codex_targets != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-addon.yml
    with:
      targets: ${{ needs.check.outputs.codex_targets || '[]' }}

  ci:
    name: CI
    needs: [check, claude, codex]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            def passed($job; $wanted):
              .[$job].result == "success"
              or (.[$job].result == "skipped" and .check.outputs[$wanted] == "false");
            .check.result == "success" and passed("claude"; "validate_claude") and passed("codex"; "validate_codex")
          '
