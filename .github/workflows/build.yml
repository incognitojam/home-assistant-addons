name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Docker Image
    # Keep both architectures on Ubuntu 24.04 for Playwright system dependencies.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        addon: [claude-terminal, codex-terminal]
        arch: [amd64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read app version
        id: addon
        run: |
          version="$(awk -F': *' '/^version:/ { gsub(/"/, "", $2); print $2; exit }' "${{ matrix.addon }}/config.yaml")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.addon }}
          file: ./${{ matrix.addon }}/Dockerfile
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          push: false
          load: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.22
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.addon.outputs.version }}
          tags: local/${{ matrix.addon }}:${{ matrix.arch }}

      - name: Test Codex daemon startup
        if: matrix.addon == 'codex-terminal'
        timeout-minutes: 3
        run: |
          docker run --rm --interactive --network none \
            --platform ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }} \
            --entrypoint /bin/bash \
            --env HOME=/data/home \
            --env CODEX_HOME=/data/.codex \
            --env CODEX_SQLITE_HOME=/data/.codex \
            local/codex-terminal:${{ matrix.arch }} \
            -s < codex-terminal/tests/daemon-startup.sh

      - name: Test Codex approval defaults
        if: matrix.addon == 'codex-terminal'
        timeout-minutes: 3
        run: |
          docker run --rm --network none \
            --platform ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }} \
            --entrypoint node \
            --env HOME=/data/home \
            --env CODEX_HOME=/data/.codex \
            --env CODEX_SQLITE_HOME=/data/.codex \
            --volume "${PWD}/codex-terminal/tests:/tests:ro" \
            local/codex-terminal:${{ matrix.arch }} \
            --test /tests/approval-defaults.test.mjs

      # Native runners exercise both add-on architectures with Chromium and WebKit.
      - name: Set up Node.js for e2e tests
        if: matrix.addon == 'claude-terminal'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: claude-terminal/tests/package-lock.json

      - name: Install e2e test dependencies
        if: matrix.addon == 'claude-terminal'
        working-directory: claude-terminal/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Test claude-terminal end to end
        if: matrix.addon == 'claude-terminal'
        timeout-minutes: 10
        working-directory: claude-terminal/tests
        env:
          IMAGE: local/claude-terminal:${{ matrix.arch }}
        run: npm test -- --grep-invert @network

      # Kept separate so a failure that depends on reaching Anthropic's API
      # is easy to tell apart from a broken image.
      - name: Test claude-terminal end to end (network)
        if: matrix.addon == 'claude-terminal'
        timeout-minutes: 5
        working-directory: claude-terminal/tests
        env:
          IMAGE: local/claude-terminal:${{ matrix.arch }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/network
        run: npm test -- --grep @network --output test-results/network

      - name: Upload e2e test artifacts
        if: failure() && matrix.addon == 'claude-terminal'
        uses: actions/upload-artifact@v7
        with:
          name: claude-terminal-e2e-results-${{ matrix.arch }}
          path: |
            claude-terminal/tests/test-results/
            claude-terminal/tests/playwright-report/
          retention-days: 14

  hadolint:
    name: Hadolint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - claude-terminal/Dockerfile
          - codex-terminal/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hadolint
        run: |
          docker run --rm \
            --volume "${PWD}:/repo:ro" \
            --workdir /repo \
            ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint "${{ matrix.dockerfile }}"

  ci:
    name: CI
    needs: [build, hadolint]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
